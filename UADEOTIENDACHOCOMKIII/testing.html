<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chocolaterie - Test Page</title>
</head>
<body>
  <h1>Chocolaterie Backend Integration Test</h1>

  <!-- User Registration -->
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p id="registerMessage"></p>

  <!-- User Login -->
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p id="loginMessage"></p>

  <!-- Add to Cart -->
  <h2>Add to Cart</h2>
  <button onclick="addToCart(1)">Add Milk Chocolate to Cart</button>

  <!-- View Cart -->
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <button onclick="viewCart()">Refresh Cart</button>

  <!-- Search Products -->
  <h2>Search Products</h2>
  <input type="text" id="searchQuery" placeholder="Search products...">
  <button onclick="searchProducts()">Search</button>
  <div id="searchResults"></div>

  <!-- Include your JavaScript file -->
  <script src="js/app.js"></script>
</body>
</html>
